name: Generate release keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate keystore and credentials
        run: |
          set -e
          ALIAS="kaimono"
          STOREPASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEYPASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            -dname "CN=Kaimono, OU=Kaimono, O=Kaimono, L=Unknown, S=Unknown, C=US"

          echo "=========== COPY THESE INTO REPO SECRETS ==========="
          echo "ALIAS=$ALIAS"
          echo "KEY_STORE_PASSWORD=$STOREPASS"
          echo "KEY_PASSWORD=$KEYPASS"
          echo ""
          echo "SIGNING_KEY (copy the whole line below):"
          base64 -w0 release.keystore
          echo ""
          echo "======================================================"
          echo ""
          echo "SHA-1 / SHA-256 for Firebase:"
          keytool -list -v -keystore release.keystore -storepass "$STOREPASS" -alias "$ALIAS" | grep -E "SHA1|SHA256"

      - name: Cleanup
        if: always()
        run: rm -f release.keystore
