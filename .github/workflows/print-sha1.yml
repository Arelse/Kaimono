name: Print SHA-1 fingerprint

on:
  workflow_dispatch:

jobs:
  print-sha1:
    runs-on: ubuntu-24.04
    steps:
      - name: Decode keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.keystore

      - name: Print SHA-1 and SHA-256
        run: |
          keytool -list -v \
            -keystore release.keystore \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -alias "${{ secrets.ALIAS }}" \
          | grep -E "SHA1|SHA256"

      - name: Cleanup
        if: always()
        run: rm -f release.keystore
